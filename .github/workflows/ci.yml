name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Workspace checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NX_DAEMON: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Test CI automation
        run: node --test tools/ci/*.test.mjs

      - name: Select relevant checks
        id: plan
        run: node tools/ci/plan.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up pnpm
        if: steps.plan.outputs.backend == 'true' || steps.plan.outputs.frontend == 'true' || steps.plan.outputs.contract == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Set up Go
        if: steps.plan.outputs.backend == 'true' || steps.plan.outputs.contract == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache-dependency-path: apps/backend/go.sum

      - name: Install JavaScript dependencies
        if: steps.plan.outputs.backend == 'true' || steps.plan.outputs.frontend == 'true' || steps.plan.outputs.contract == 'true'
        run: pnpm install --frozen-lockfile

      - name: Download and verify Go dependencies
        if: steps.plan.outputs.backend == 'true' || steps.plan.outputs.contract == 'true'
        working-directory: apps/backend
        run: |
          go mod download
          go mod verify

      - name: Regenerate API contract and client
        if: steps.plan.outputs.contract == 'true'
        run: pnpm generate

      - name: Verify generated files and compare contract
        if: steps.plan.outputs.contract == 'true'
        id: contract
        run: node tools/ci/contract.mjs
        env:
          CI_BASE: ${{ steps.plan.outputs.base }}

      - name: Check backend
        if: steps.plan.outputs.backend == 'true'
        run: pnpm exec nx run-many -t lint,format:check,test,build --projects=backend --excludeTaskDependencies --parallel=2

      # Generation is handled above when relevant. Excluding Nx dependencies here
      # prevents a frontend-only change from starting Go schema generation.
      - name: Check frontend
        if: steps.plan.outputs.frontend == 'true' || steps.contract.outputs.changed == 'true'
        run: pnpm exec nx run-many -t lint,format:check,typecheck,build --projects=web --excludeTaskDependencies --parallel=1
